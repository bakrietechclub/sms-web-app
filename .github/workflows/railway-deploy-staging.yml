name: Deploy to Railway (Staging)

run-name: "🧪 Deploy Staging (Branch: ${{ github.ref_name }}) by @${{ github.actor }}"

on:
  push:
    branches:
      - staging

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: 🚀 Build & Deploy to Railway (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: 🔍 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Staging App
        run: npm run build:staging
        env:
          CI: false

      - name: 🚄 Install Railway CLI
        run: npm install -g @railway/cli

      - name: 🚀 Deploy to Railway (Staging)
        run: railway up --service web-app-sms --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      - name: 📝 Write Deployment Summary
        if: always()
        run: |
          DEPLOY_STATUS="${{ job.status }}"
          if [ "$DEPLOY_STATUS" == "success" ]; then
            STATUS_LABEL="✅ Success"
          else
            STATUS_LABEL="❌ Failed"
          fi

          echo "### 🧪 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | $STATUS_LABEL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Staging 🧪 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Service** | \`web-app-sms\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
